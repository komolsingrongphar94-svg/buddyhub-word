
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loop Word - Login</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  background:linear-gradient(135deg,#10102c,#25256b);
  font-family:Arial,sans-serif;color:white;padding:20px
}
.card{
  width:100%;max-width:390px;background:#191936;
  padding:28px;border-radius:18px;box-shadow:0 10px 35px #0006
}
h1{text-align:center;color:#a78bfa}
p{text-align:center;color:#bbb}
input,button{
  width:100%;padding:14px;margin:9px 0;
  border:0;border-radius:9px;font-size:15px
}
input{background:#29294b;color:white;border:1px solid #555}
button{background:#8b5cf6;color:white;font-weight:bold;cursor:pointer}
.switch{background:#34345a}
.message{text-align:center;font-size:14px;min-height:20px}
.hidden{display:none}
</style>
</head>
<body>

<div class="card">
  <h1>✨ Loop Word</h1>
  <p>Your word and emoji generator</p>

  <form id="registerForm">
    <h3>Create Account</h3>
    <input id="regName" type="text" placeholder="Your name" required>
    <input id="regEmail" type="email" placeholder="Email address" required>
    <input id="regPassword" type="password" placeholder="Password (at least 6 characters)" minlength="6" required>
    <button type="submit">Register</button>
    <button type="button" class="switch" id="showLogin">Already registered? Login</button>
  </form>

  <form id="loginForm" class="hidden">
    <h3>Welcome Back</h3>
    <input id="loginEmail" type="email" placeholder="Email address" required>
    <input id="loginPassword" type="password" placeholder="Password" required>
    <button type="submit">Login</button>
    <button type="button" class="switch" id="showRegister">Create a new account</button>
  </form>

  <div class="message" id="message"></div>
</div>

<script type="module">
import {
  auth, db,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  doc, setDoc
} from "./firebase.js";

import {
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

const registerForm = document.getElementById("registerForm");
const loginForm = document.getElementById("loginForm");
const message = document.getElementById("message");

document.getElementById("showLogin").onclick = () => {
  registerForm.classList.add("hidden");
  loginForm.classList.remove("hidden");
  message.textContent = "";
};

document.getElementById("showRegister").onclick = () => {
  loginForm.classList.add("hidden");
  registerForm.classList.remove("hidden");
  message.textContent = "";
};

function showError(error) {
  const errors = {
    "auth/email-already-in-use": "This email is already registered. Please log in.",
    "auth/invalid-email": "Please enter a valid email address.",
    "auth/weak-password": "Password must contain at least 6 characters.",
    "auth/invalid-credential": "Incorrect email or password.",
    "auth/network-request-failed": "Network error. Check your internet connection."
  };
  return errors[error.code] || error.message;
}

onAuthStateChanged(auth, user => {
  if (user) window.location.href = "index.html";
});

registerForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  message.textContent = "Creating your account...";

  const name = document.getElementById("regName").value.trim();
  const email = document.getElementById("regEmail").value.trim();
  const password = document.getElementById("regPassword").value;

  try {
    const result = await createUserWithEmailAndPassword(auth, email, password);

    await setDoc(doc(db, "users", result.user.uid), {
      name: name,
      email: email,
      createdAt: serverTimestamp()
    });

    message.textContent = "Account created successfully!";
    window.location.href = "index.html";

  } catch (error) {
    message.textContent = showError(error);
  }
});

loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  message.textContent = "Logging in...";

  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  try {
    await signInWithEmailAndPassword(auth, email, password);
    message.textContent = "Login successful!";
    window.location.href = "index.html";
  } catch (error) {
    message.textContent = showError(error);
  }
});
</script>

</body>
</html>
