<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buddyhub Word</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:20px;
  display:grid;place-items:center;
  font-family:Arial,sans-serif;color:white;
  background:linear-gradient(135deg,#10102c,#25256b)
}
.container{
  width:100%;max-width:430px;padding:28px;
  border-radius:18px;background:#191936;
  text-align:center;box-shadow:0 10px 35px #0006
}
h1{color:#a78bfa}
p{color:#bbb;line-height:1.6}
button{
  width:100%;padding:14px;margin-top:14px;
  border:0;border-radius:9px;
  background:#8b5cf6;color:white;
  font-size:16px;font-weight:bold
}
.secondary{background:#34345a}
</style>
</head>
<body>
<div class="container">
  <h1>✨ Buddyhub Word</h1>
  <p>Welcome to your Words & Emoji Generator!</p>
  <p id="welcome">Checking your account...</p>
  <button id="openGenerator" hidden>Open Word Generator</button>
  <button id="logout" class="secondary" hidden>Logout</button>
</div>

<script type="module">
import { auth, onAuthStateChanged, signOut } from "./firebase.js";

const welcome = document.getElementById("welcome");
const openGenerator = document.getElementById("openGenerator");
const logout = document.getElementById("logout");

onAuthStateChanged(auth, user => {
  if (!user) {
    window.location.replace("auth.html");
    return;
  }

  welcome.textContent = "Welcome, " + (user.displayName || user.email) + "!";
  openGenerator.hidden = false;
  logout.hidden = false;
});

openGenerator.onclick = () => {
  window.location.href = "generator.html";
};

logout.onclick = async () => {
  try {
    await signOut(auth);
    window.location.replace("auth.html");
  } catch (error) {
    welcome.textContent = "Logout failed: " + error.message;
  }
};
</script>
</body>
</html>
